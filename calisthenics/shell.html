<title>Jonathan's Calisthenics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column of big, single-idea cards; sticky tab strip on top; full-screen 3D demo sheet. Dark-only by design (teal + black). */
:root {
  --bg: #050909; --surface: #0b1415; --surface2: #10201f; --line: #1c3331; --text: #e7f3f1; --muted: #8fb0ab;
  --teal: #1fd1bd; --teal-2: #0f8f83; --teal-ink: #021513; --amber: #f3b23f; --red: #ff5a5f; --green: #3ddc84; --blue: #3a8dff;
  --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif; --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--text); }
body { font: 17px/1.5 var(--body); margin: 0; -webkit-font-smoothing: antialiased; }
body.noscroll { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; padding: 10px max(16px, env(safe-area-inset-left, 0px)) 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand b { font: 800 22px/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
.brand b i { color: var(--teal); font-style: normal; }
#status { font-size: 13px; }
#tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 8px 0 0; }
#tabs::-webkit-scrollbar { display: none; }
#tabs a { flex: none; color: var(--muted); text-decoration: none; font: 700 16px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; padding: 10px 12px 12px; border-bottom: 3px solid transparent; }
#tabs a.on { color: var(--text); border-bottom-color: var(--teal); }
#tabs a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.03em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(34px, 8vw, 48px); line-height: 0.95; font-weight: 800; }
h1 span { color: var(--teal); display: block; font-size: 0.62em; letter-spacing: 0.05em; margin-top: 4px; }
h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
h3 { font-size: 22px; font-weight: 700; line-height: 1.05; }
p { margin: 0 0 8px; }
.fine { color: var(--muted); font-size: 14px; }
.eyebrow, .tag { font: 700 13px/1.2 var(--display); letter-spacing: 0.12em; color: var(--teal); text-transform: uppercase; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hero { padding: 22px 0 12px; display: grid; gap: 12px; }
.hero.slim p { color: var(--muted); max-width: 60ch; }
.daypick { display: flex; gap: 8px; }
.daypick button { flex: 1; }
.daypick small { display: block; font: 600 11px/1 var(--body); color: var(--teal); letter-spacing: 0.05em; text-transform: uppercase; margin-top: 3px; }
button { font: 600 16px/1.1 var(--body); color: var(--text); background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; min-height: 46px; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.on { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); }
button.primary { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); font-weight: 700; }
button.link { background: none; border: 0; color: var(--teal); padding: 6px 0; min-height: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin: 14px 0; }
.block { margin: 26px 0; }
.block > h2 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.alert { border-radius: 12px; padding: 12px 14px; margin: 10px 0; font-size: 15px; border: 1px solid; }
.alert.amber { border-color: color-mix(in srgb, var(--amber) 50%, transparent); background: color-mix(in srgb, var(--amber) 10%, transparent); }
.alert.teal { border-color: color-mix(in srgb, var(--teal) 50%, transparent); background: color-mix(in srgb, var(--teal) 9%, transparent); }
.pill { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 13px; background: var(--surface2); color: var(--muted); border: 1px solid var(--line); }
.pill.ok { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, transparent); }
.pill.amber { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, transparent); }
.pill.red { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
.warm { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 12px 0; color: var(--muted); }
.warm b { color: var(--text); font: 700 16px var(--display); letter-spacing: 0.08em; text-transform: uppercase; }
.warm a { color: var(--teal); }
.changed { border-left: 4px solid var(--teal); background: var(--surface); border-radius: 4px 14px 14px 4px; padding: 14px 16px; margin: 14px 0; }
.changed.fresh { background: color-mix(in srgb, var(--teal) 10%, var(--surface)); }
.changed ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.ex-top { display: flex; gap: 14px; align-items: flex-start; }
.num { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface2); border: 1px solid var(--line); font: 800 20px var(--display); color: var(--teal); }
.ex-head { min-width: 0; display: grid; gap: 4px; }
.dose { font-weight: 600; }
.tempo { color: var(--muted); font-size: 15px; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: block; }
.dots i.done { background: var(--teal-2); }
.dots i.on { background: var(--teal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--teal) 30%, transparent); }
.demo-btn { display: inline-flex; align-items: center; gap: 10px; margin: 14px 0 6px; background: #071a2b; border-color: #1d4f80; color: #cfe6ff; font-weight: 700; }
.demo-btn .play { width: 0; height: 0; border-left: 11px solid #4aa3ff; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
.cues { margin: 8px 0; padding-left: 22px; display: grid; gap: 4px; }
.cues li::marker { color: var(--teal); }
.feel { font-size: 15px; color: var(--muted); }
.feel b, .unlock b, .gate b, .wrongtxt b { color: var(--text); }
.wrongtxt { font-size: 15px; color: #ffb3b5; }
.gate { font-size: 15px; color: var(--amber); }
.unlock { font-size: 15px; color: var(--muted); margin-top: 8px; }
.rest { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0 4px; }
.rest div { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.rest b { display: block; font: 700 12px/1.2 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--teal); margin-bottom: 2px; }
.rest span { font-size: 14px; line-height: 1.3; display: block; }
@media (max-width: 520px) { .rest { grid-template-columns: 1fr; } }
.logbox { border-top: 1px dashed var(--line); margin-top: 14px; padding-top: 14px; display: grid; gap: 12px; }
.lb-title { font: 700 16px var(--display); letter-spacing: 0.1em; text-transform: uppercase; }
.lb-title small { font: 400 13px var(--body); color: var(--muted); text-transform: none; letter-spacing: 0; }
.sets { display: flex; gap: 8px; flex-wrap: wrap; }
.set { display: grid; gap: 2px; justify-items: center; font-size: 12px; color: var(--muted); }
.set input { width: 72px; height: 52px; font: 700 22px var(--body); text-align: center; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; }
.set input::placeholder { color: #4d6a66; }
.set em { font-style: normal; }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rate button.on.easy { background: var(--blue); border-color: var(--blue); color: #fff; }
.rate button.on.right { background: var(--teal); }
.rate button.on.hard { background: var(--amber); border-color: var(--amber); color: #201300; }
.pain { display: grid; gap: 6px; }
.pain span { display: flex; justify-content: space-between; font-weight: 600; }
.pain input { width: 100%; accent-color: var(--teal); height: 28px; }
.pv { font-variant-numeric: tabular-nums; }
.pv.g { color: var(--green); } .pv.a { color: var(--amber); } .pv.r { color: var(--red); }
.painkey { display: flex; justify-content: space-between; font-size: 12px; margin-top: -6px; }
.painkey .g { color: var(--green); } .painkey .a { color: var(--amber); } .painkey .r { color: var(--red); }
.formchk { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.formchk input { width: 22px; height: 22px; accent-color: var(--teal); }
.flowlist { padding-left: 22px; margin: 10px 0; display: grid; gap: 6px; }
.flowlist li { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.flowlist li span { min-width: 0; }
.flowlist em { color: var(--muted); font-style: normal; font-size: 14px; display: block; }
.flowlist .demo-btn { margin: 0; flex: none; padding: 8px 12px; min-height: 40px; }
.finish { margin: 22px 0; display: grid; gap: 8px; }
.finish .primary { min-height: 58px; font-size: 19px; }
.stop { border: 1px solid color-mix(in srgb, var(--red) 45%, transparent); background: color-mix(in srgb, var(--red) 7%, var(--surface)); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
.stop h2 { color: var(--red); }
.rules { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin: 14px 0; }
.rules ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.rules li::marker { color: var(--teal); }
.check { border-color: var(--teal-2); }
.check h2 { margin-top: 4px; }
.check .rate, .check .pain { margin: 10px 0; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.chips button { min-height: 40px; padding: 8px 12px; font-size: 15px; }
.mini-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.mini-head > div { min-width: 0; flex: 1 1 260px; display: grid; gap: 4px; }
.mini-head .demo-btn { margin: 0; }
.card.mini.here { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal) inset; }
.card.mini.done { opacity: 0.8; }
details { border-top: 1px solid var(--line); padding: 10px 0; }
details summary { cursor: pointer; font: 700 18px var(--display); letter-spacing: 0.05em; text-transform: uppercase; }
details p { margin-top: 8px; color: var(--muted); }
.path { padding-left: 22px; display: grid; gap: 10px; }
.locked { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.locked span { background: var(--surface2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; color: var(--muted); }
.gates { padding-left: 20px; }
.block h3 { margin: 10px 0 6px; font-size: 18px; }
.logrow .lr-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.logrow .lr-head span { color: var(--muted); }
.entries { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
.entries li { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 15px; border-top: 1px solid var(--line); padding-top: 6px; }
.entries small { color: var(--muted); }
.nums { font-variant-numeric: tabular-nums; }
.nums i { font-style: normal; color: var(--muted); font-size: 13px; }
.changes { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.changes li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.changes span { display: block; font: 700 13px var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--teal); }
.empty { color: var(--muted); }
.works .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
.works .stats div { background: var(--surface2); border-radius: 10px; padding: 8px; text-align: center; }
.works .stats b { display: block; font: 800 22px var(--display); }
.works .stats span { font-size: 12px; color: var(--muted); }
@media (max-width: 520px) { .works .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.verdict { font: 800 16px var(--display); letter-spacing: 0.1em; text-transform: uppercase; border-radius: 999px; padding: 6px 14px; }
.v-keep { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
.v-modify { background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber); }
.v-drop { background: color-mix(in srgb, var(--red) 18%, transparent); color: var(--red); }
.enjoy { display: flex; align-items: center; gap: 4px; }
.enjoy span { color: var(--muted); font-size: 14px; margin-right: 6px; }
.enjoy button { background: none; border: 0; font-size: 26px; color: var(--line); padding: 0 4px; min-height: 40px; }
.enjoy button.on { color: var(--amber); background: none; }
.hist { padding-left: 18px; color: var(--muted); font-size: 14px; margin: 8px 0; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.wrow { display: flex; gap: 8px; }
.wrow input { flex: 1; min-width: 0; height: 48px; font: 600 18px var(--body); background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; vertical-align: top; padding: 8px 6px; border-top: 1px solid var(--line); }
th { font-weight: 600; width: 50%; }
td { color: var(--muted); }
.notes { display: grid; gap: 6px; font-size: 15px; font-weight: 600; }
.notes textarea { width: 100%; min-height: 60px; font: 400 16px/1.4 var(--body); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; }
.lasttime { font-size: 15px; color: var(--muted); background: var(--surface2); border-radius: 10px; padding: 8px 12px; margin: 10px 0 0; }
.lasttime b { color: var(--text); }
.prep { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 18px; margin: 14px 0; }
.prep h2 { font-size: 20px; color: var(--teal); }
.prep ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.entries q { display: block; width: 100%; color: var(--muted); font-size: 14px; font-style: italic; quotes: "“" "”"; }
.why li { margin-bottom: 8px; }
.why a { color: var(--teal); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--teal); color: var(--teal-ink); font-weight: 700; padding: 12px 18px; border-radius: 12px; z-index: 50; max-width: calc(100% - 32px); }
/* player */
#player { position: fixed; inset: 0; z-index: 40; background: rgba(0, 3, 8, 0.92); display: grid; place-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.sheet { width: min(640px, 100%); background: #04080f; border: 1px solid #12304f; border-radius: 18px; overflow: hidden; }
.pl-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; }
.pl-head h2 { margin: 0; font-size: 22px; color: #fff; letter-spacing: 0.05em; min-width: 0; }
.stage { position: relative; aspect-ratio: 1 / 1; max-height: 64vh; width: 100%; background: #03070d; }
#pl-canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.cap { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: 92%; text-align: center; background: rgba(2, 8, 18, 0.82); color: #fff; border: 1px solid rgba(74, 163, 255, 0.55); font: 800 clamp(16px, 4.4vw, 22px)/1.1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 14px; border-radius: 8px; box-shadow: 0 0 18px rgba(40, 130, 255, 0.35); animation: capIn 0.18s ease-out; }
.cap.wrong { border-color: #ff4d57; color: #ffd6d8; box-shadow: 0 0 18px rgba(255, 60, 70, 0.45); }
.cap.beep { border-color: #ffd24a; color: #fff3c4; }
@keyframes capIn { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
@media (prefers-reduced-motion: reduce) { .cap { animation: none; } }
.pl-title-in { position: absolute; left: 14px; top: 12px; font: 800 20px var(--display); letter-spacing: 0.08em; color: #fff; text-transform: uppercase; text-shadow: 0 2px 10px #000; pointer-events: none; max-width: 70%; }
.pl-hint { position: absolute; right: 12px; top: 14px; font-size: 12px; color: #9cc3ff; opacity: 0.8; pointer-events: none; }
.barwrap { height: 4px; background: #0d1d33; }
#pl-bar { height: 100%; width: 0; background: #3a8dff; }
.pl-ctl { display: flex; gap: 8px; padding: 12px 14px; flex-wrap: wrap; }
.pl-ctl button { flex: 1; min-width: 90px; background: #0a1a2e; border-color: #1d3b5f; }
.pl-ctl button.on { background: #3a8dff; color: #fff; border-color: #3a8dff; }
#pl-cues { padding: 0 16px 16px; color: #d6e6ff; }
#pl-fail { padding: 30px 16px; text-align: center; color: var(--muted); }
</style>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>Jonathan’s <i>Calisthenics</i></b><span id="status"></span></div>
    <nav id="tabs" aria-label="Sections"></nav>
  </header>
  <main id="view"><p class="fine" style="padding:24px 0">Loading your plan…</p></main>
</div>
<div id="toast" role="status" hidden></div>
<div id="player" hidden role="dialog" aria-modal="true" aria-labelledby="pl-title">
  <div class="sheet">
    <div class="pl-head"><h2 id="pl-title">Demo</h2><button type="button" id="pl-close" aria-label="Close demo">Close</button></div>
    <div class="stage">
      <canvas id="pl-canvas" aria-label="3D exercise demo"></canvas>
      <div class="pl-hint">Drag to turn</div>
      <div id="pl-cap" class="cap" hidden></div>
      <div id="pl-fail" hidden>The 3D demo couldn’t load here (it needs WebGL and the 3D library). The form notes are below.</div>
    </div>
    <div class="barwrap"><div id="pl-bar"></div></div>
    <div class="pl-ctl"><button type="button" id="pl-pause">Pause</button><button type="button" id="pl-slow">Slow 0.5×</button><button type="button" id="pl-restart">Restart rep</button></div>
    <div id="pl-cues"></div>
  </div>
</div>
